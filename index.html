  function handleSettingsImageFile(field, maxDim, quality) {
    return function (e) {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      setSettingsImageError(false);
      readImageAsDataUrl(file, maxDim, quality)
        .then((dataUrl) => {
          const key = makeImageKey();
          return idbPutImage(key, dataUrl).then(() => {
            setImageCache((c) => ({ ...c, [key]: dataUrl }));
            setMapSettings((s) => {
              const prevKey = s[field];
              if (isImageKey(prevKey)) {
                idbDeleteImage(prevKey).catch(() => {});
                setImageCache((c) => {
                  const next = { ...c };
                  delete next[prevKey];
                  return next;
                });
              }
              return { ...s, [field]: key };
            });
          });
        })
        .catch(() => setSettingsImageError(true));
    };
  }

  function clearSettingsImage(field) {
    setMapSettings((s) => {
      const prevKey = s[field];
      if (isImageKey(prevKey)) {
        idbDeleteImage(prevKey).catch(() => {});
        setImageCache((c) => {
          const next = { ...c };
          delete next[prevKey];
          return next;
        });
      }
      return { ...s, [field]: '' };
    });
  }

  function savePlanetForm() {
    if (!editingPlanet || !editingPlanet.name.trim()) return;
    const orig = originalPlanetImagesRef.current;
    if (isImageKey(orig.imageUrl) && orig.imageUrl !== editingPlanet.imageUrl) {
      idbDeleteImage(orig.imageUrl).catch(() => {});
      setImageCache((c) => {
        const next = { ...c };
        delete next[orig.imageUrl];
        return next;
      });
    }
    if (isImageKey(orig.crestUrl) && orig.crestUrl !== editingPlanet.crestUrl) {
      idbDeleteImage(orig.crestUrl).catch(() => {});
      setImageCache((c) => {
        const next = { ...c };
        delete next[orig.crestUrl];
        return next;
      });
    }
    setPlanets((prev) => {
      if (editingPlanet.id) {
        return prev.map((p) => (p.id === editingPlanet.id ? { ...editingPlanet } : p));
      }
      const newPlanet = { ...editingPlanet, id: makeId(editingPlanet.name) };
      return [...prev, newPlanet];
    });
    setEditingPlanet(null);
  }

  function addRoute() {
    if (!routeDraft.a || !routeDraft.b || routeDraft.a === routeDraft.b) return;
    setRoutes((prev) => {
      const exists = prev.some(
        ([a, b]) => (a === routeDraft.a && b === routeDraft.b) || (a === routeDraft.b && b === routeDraft.a)
      );
      if (exists) return prev;
      return [...prev, [routeDraft.a, routeDraft.b]];
    });
    setRouteDraft({ a: '', b: '' });
  }

  const legendItems =
    colorMode === 'environment'
      ? ENVIRONMENTS.map((e) => ({ label: e.label, color: e.color }))
      : FACTIONS.map((f) => ({ label: f, color: FACTION_COLORS[f] }));

  const routeDistances = routes.map(([a, b]) => {
    const pa = planets.find((p) => p.id === a);
    const pb = planets.find((p) => p.id === b);
    if (!pa || !pb) return null;
    const va = sphericalToVector3(pa.orbitRadius, pa.orbitAngle, pa.elevation);
    const vb = sphericalToVector3(pb.orbitRadius, pb.orbitAngle, pb.elevation);
    return Math.round(va.distanceTo(vb) * 10) / 10;
  });

  return (
    <div
      className="relative w-full h-screen overflow-hidden select-none"
      style={{ background: COLORS.bgVoid, color: COLORS.text, fontFamily: "'IBM Plex Sans', sans-serif" }}
    >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

        .lgm-scroll::-webkit-scrollbar { width: 6px; }
        .lgm-scroll::-webkit-scrollbar-thumb { background: ${COLORS.panelBorder}; border-radius: 4px; }

        .lgm-btn {
          transition: border-color 0.15s ease, background-color 0.15s ease;
        }
        .lgm-btn:hover { border-color: ${COLORS.accent}; }

        .lgm-label-dot {
          display: inline-block; width: 6px; height: 6px; border-radius: 9999px; margin-right: 6px; vertical-align: middle;
        }

        .lgm-input {
          transition: border-color 0.15s ease;
        }
        .lgm-input:focus {
          border-color: ${COLORS.accent} !important;
        }

        @keyframes lgm-holo-flicker {
          0%, 100% { opacity: 1; }
          8% { opacity: 0.965; }
          9% { opacity: 1; }
          32% { opacity: 1; }
          33% { opacity: 0.955; }
          35% { opacity: 1; }
          67% { opacity: 1; }
          68% { opacity: 0.975; }
          70% { opacity: 1; }
        }
        .lgm-hologram { animation: lgm-holo-flicker 7s infinite; }

        @keyframes lgm-scan-drift {
          from { background-position: 0 0; }
          to { background-position: 0 120px; }
        }
        .lgm-scanlines {
          background-image: repeating-linear-gradient(
            to bottom,
            rgba(212,162,76,0.05) 0px,
            rgba(212,162,76,0.05) 1px,
            transparent 1px,
            transparent 3px
          );
          animation: lgm-scan-drift 9s linear infinite;
        }
      `}</style>

      <div ref={mountRef} className="absolute inset-0 lgm-hologram" />

      <div
        className="absolute inset-0 pointer-events-none"
        style={{ background: `radial-gradient(ellipse at center, transparent 40%, ${COLORS.bgVoid} 100%)` }}
      />
      <div className="absolute inset-0 pointer-events-none lgm-scanlines" />

      <div className="absolute inset-0 pointer-events-none overflow-hidden">
        {planets.map((p) => (
          <div
            key={p.id}
            ref={(el) => {
              labelRefs.current[p.id] = el;
            }}
            className="absolute"
            style={{ transform: 'translate(-9999px,-9999px)', transition: 'opacity 0.2s', marginLeft: '10px', marginTop: '-6px' }}
          >
            <span
              className="text-xs whitespace-nowrap px-1.5 py-0.5 rounded"
              style={{
                fontFamily: "'IBM Plex Mono', monospace",
                background: p.id === selectedId ? 'rgba(10,9,6,0.85)' : 'rgba(10,9,6,0.55)',
                color: p.id === selectedId ? COLORS.accent : COLORS.textMuted,
                border: '1px solid ' + (p.id === selectedId ? COLORS.accent : 'transparent'),
              }}
            >
              <span className="lgm-label-dot" style={{ background: getPlanetColor(p, colorMode) }} />
              {p.name}
            </span>
          </div>
        ))}
        {routes.map((route, i) => (
          <div
            key={'route-' + i}
            ref={(el) => {
              routeLabelRefs.current[i] = el;
            }}
            className="absolute"
            style={{ transform: 'translate(-9999px,-9999px)', transition: 'opacity 0.2s' }}
          >
            <span
              className="text-xs whitespace-nowrap px-1 rounded"
              style={{
                fontFamily: "'IBM Plex Mono', monospace",
                fontSize: '10px',
                background: 'rgba(10,9,6,0.5)',
                color: COLORS.accent,
              }}
            >
              {routeDistances[i] != null ? '≈' + routeDistances[i] + ' al' : ''}
            </span>
          </div>
        ))}
      </div>

      <div className="absolute top-0 left-0 right-0 flex items-start justify-between p-4 pointer-events-none">
        <div className="pointer-events-auto flex items-center gap-3">
          {resolveImage(mapSettings.bannerUrl) && (
            <img
              src={resolveImage(mapSettings.bannerUrl)}
              alt=""
              className="rounded flex-shrink-0"
              style={{ width: 44, height: 44, objectFit: 'cover', border: '1px solid ' + COLORS.panelBorder }}
            />
          )}
          <div>
            <h1 className="text-xl md:text-2xl tracking-wide" style={{ fontFamily: "'Cinzel', serif", color: COLORS.text }}>
              Carte du Landsraad
            </h1>
            <p className="text-xs mt-1" style={{ color: COLORS.textMuted, letterSpacing: '0.02em' }}>
              Maisons et factions de l'Imperium — distances estimées depuis Kaitain
            </p>
          </div>
        </div>

        <div className="flex flex-wrap gap-2 pointer-events-auto justify-end">
          <button
            onClick={() => setColorMode((m) => (m === 'faction' ? 'environment' : 'faction'))}
            className="lgm-btn flex items-center gap-1.5 text-xs px-3 py-2 rounded"
            style={toolbarBtnStyle(colorMode === 'environment')}
            title="Basculer entre coloration par faction et coloration par environnement"
          >
            <Palette size={14} />
            {colorMode === 'environment' ? 'Couleurs : Environnements' : 'Couleurs : Factions'}
          </button>
          <button
            onClick={() => setTourActive((v) => !v)}
            className="lgm-btn flex items-center gap-1.5 text-xs px-3 py-2 rounded"
            style={toolbarBtnStyle(tourActive)}
          >
            {tourActive ? <Square size={14} /> : <Compass size={14} />}
            {tourActive ? 'Arrêter' : 'Visite guidée'}
          </button>
          <button
            onClick={() => setEditMode((v) => !v)}
            className="lgm-btn flex items-center gap-1.5 text-xs px-3 py-2 rounded"
            style={toolbarBtnStyle(editMode)}
          >
            <Settings size={14} />
            {editMode ? 'Édition : ON' : 'Édition : OFF'}
          </button>
          <button
            onClick={handleManualSave}
            className="lgm-btn flex items-center gap-1.5 text-xs px-3 py-2 rounded"
            style={toolbarBtnStyle(justSaved)}
          >
            {justSaved ? <Check size={14} /> : <Save size={14} />}
            {justSaved ? 'Enregistré' : 'Enregistrer'}
          </button>
        </div>
      </div>

      <div
        className="absolute bottom-4 left-4 rounded-lg p-3 pointer-events-none"
        style={{ background: 'rgba(22,18,9,0.75)', border: '1px solid ' + COLORS.panelBorder }}
      >
        <p className="text-xs mb-2" style={{ color: COLORS.textMuted, fontFamily: "'IBM Plex Mono', monospace", letterSpacing: '0.08em' }}>
          CATÉGORIES
        </p>
        <div className="flex flex-col gap-1.5">
          {legendItems.map((item) => (
            <div key={item.label} className="flex items-center gap-2 text-xs">
              <span className="inline-block rounded-full" style={{ width: 8, height: 8, background: item.color }} />
              <span style={{ color: COLORS.text }}>{item.label}</span>
            </div>
          ))}
        </div>
      </div>

      <div className="absolute top-1/2 left-4 -translate-y-1/2 flex flex-col gap-1 pointer-events-auto">
        <button
          onClick={zoomIn}
          className="lgm-btn flex items-center justify-center rounded"
          style={{ ...toolbarBtnStyle(false), width: 30, height: 30 }}
          title="Zoomer"
          aria-label="Zoomer"
        >
          <Plus size={15} />
        </button>
        <button
          onClick={zoomOut}
          className="lgm-btn flex items-center justify-center rounded"
          style={{ ...toolbarBtnStyle(false), width: 30, height: 30 }}
          title="Dézoomer"
          aria-label="Dézoomer"
        >
          <Minus size={15} />
        </button>
      </div>

      {!editMode && !selectedPlanet && (
        <div className="absolute bottom-4 right-4 text-xs pointer-events-none" style={{ color: COLORS.textMuted }}>
          glisser pour tourner · molette ou boutons +/− pour zoomer · clic sur une planète
        </div>
      )}

      {saveError && (
        <div
          className="absolute top-4 left-1/2 -translate-x-1/2 text-xs px-3 py-1.5 rounded pointer-events-none"
          style={{ background: COLORS.crimson + '33', color: COLORS.crimson, border: '1px solid ' + COLORS.crimson + '66' }}
        >
          Sauvegarde impossible — tes modifications resteront le temps de la session
        </div>
      )}

      {!loaded && (
        <div className="absolute inset-0 flex items-center justify-center" style={{ background: COLORS.bgVoid }}>
          <div className="flex items-center gap-2 text-sm" style={{ color: COLORS.textMuted }}>
            <Loader2 size={16} className="animate-spin" />
            Chargement de la carte…
          </div>
        </div>
      )}

      {selectedPlanet && (
        <div
          className="absolute top-0 right-0 h-full w-full sm:w-96 overflow-y-auto lgm-scroll p-5"
          style={{
            background: resolveImage(mapSettings.panelBgUrl)
              ? `linear-gradient(rgba(15,12,7,0.90), rgba(15,12,7,0.90)), url(${resolveImage(mapSettings.panelBgUrl)}) center / cover no-repeat`
              : 'rgba(15,12,7,0.92)',
            borderLeft: '1px solid ' + COLORS.panelBorder,
            backdropFilter: 'blur(4px)',
          }}
        >
          <div className="flex items-start justify-between mb-3">
            <div className="flex items-center gap-2.5">
              {resolveImage(selectedPlanet.crestUrl) && (
                <img
                  src={resolveImage(selectedPlanet.crestUrl)}
                  alt=""
                  className="rounded flex-shrink-0"
                  style={{ width: 34, height: 34, objectFit: 'cover', border: '1px solid ' + COLORS.panelBorder }}
                />
              )}
              <div>
                <h2 className="text-lg" style={{ fontFamily: "'Cinzel', serif", color: COLORS.text }}>
                  {selectedPlanet.name}
                </h2>
                <p className="text-xs mt-0.5" style={{ color: COLORS.textMuted }}>
                  Maison {selectedPlanet.house}
                </p>
              </div>
            </div>
            <button onClick={() => setSelectedId(null)} className="lgm-btn rounded p-1" style={{ color: COLORS.textMuted, boxShadow: 'none' }}>
              <X size={18} />
            </button>
          </div>

          {resolveImage(selectedPlanet.imageUrl) && (
            <div className="mb-4 rounded overflow-hidden" style={{ border: '1px solid ' + COLORS.panelBorder }}>
              <img
                src={resolveImage(selectedPlanet.imageUrl)}
                alt={selectedPlanet.name}
                className="w-full block"
                style={{ maxHeight: 220, objectFit: 'cover' }}
              />
            </div>
          )}

          <div className="flex flex-wrap gap-2 mb-4">
            <span
              className="text-xs px-2 py-1 rounded"
              style={{
                background: FACTION_COLORS[selectedPlanet.faction] + '22',
                color: FACTION_COLORS[selectedPlanet.faction],
                border: '1px solid ' + FACTION_COLORS[selectedPlanet.faction] + '55',
              }}
            >
              {selectedPlanet.faction}
            </span>
            {selectedPlanet.environment && (
              <span
                className="text-xs px-2 py-1 rounded"
                style={{
                  background: ENVIRONMENT_COLORS[selectedPlanet.environment] + '22',
                  color: ENVIRONMENT_COLORS[selectedPlanet.environment],
                  border: '1px solid ' + ENVIRONMENT_COLORS[selectedPlanet.environment] + '55',
                }}
              >
                {ENVIRONMENT_LABELS[selectedPlanet.environment]}
              </span>
            )}
          </div>

          <p className="text-sm leading-relaxed mb-4" style={{ color: COLORS.text }}>
            {selectedPlanet.description}
          </p>

          {selectedPlanet.resources && (
            <div className="text-xs mb-4 rounded p-2.5" style={{ background: 'rgba(255,255,255,0.025)', borderLeft: '2px solid ' + COLORS.jade }}>
              <p style={{ color: COLORS.textMuted, fontFamily: "'IBM Plex Mono', monospace", letterSpacing: '0.06em' }}>RESSOURCES</p>
              <p className="mt-1" style={{ color: COLORS.text }}>
                {selectedPlanet.resources}
              </p>
            </div>
          )}

          {selectedPlanet.distanceLy !== '' && selectedPlanet.distanceLy != null && (
            <div
              className="text-xs mb-4 rounded p-2.5"
              style={{ background: 'rgba(255,255,255,0.03)', borderLeft: '2px solid ' + COLORS.gold }}
            >
              <p style={{ color: COLORS.textMuted, fontFamily: "'IBM Plex Mono', monospace", letterSpacing: '0.06em' }}>DISTANCE</p>
              <p className="mt-1" style={{ color: COLORS.text }}>
                {selectedPlanet.distanceLy} années-lumière depuis Kaitain
              </p>
            </div>
          )}

          {editMode && (
            <div className="flex gap-2 pt-3" style={{ borderTop: '1px solid ' + COLORS.panelBorder }}>
              <button
                onClick={() => openEditPlanetForm(selectedPlanet)}
                className="lgm-btn flex items-center gap-1.5 text-xs px-3 py-2 rounded"
                style={toolbarBtnStyle(false)}
              >
                <Pencil size={13} /> Modifier
              </button>
              <button
                onClick={() => requestDeletePlanet(selectedPlanet.id)}
                className="lgm-btn flex items-center gap-1.5 text-xs px-3 py-2 rounded"
                style={{ ...toolbarBtnStyle(false), color: COLORS.crimson, borderColor: COLORS.crimson + '66' }}
              >
                <Trash2 size={13} /> Supprimer
              </button>
            </div>
          )}
        </div>
      )}

      {editMode && (
        <div
          className="absolute top-0 left-0 h-full w-full sm:w-80 overflow-y-auto lgm-scroll p-5"
          style={{ background: 'rgba(15,12,7,0.92)', borderRight: '1px solid ' + COLORS.panelBorder, backdropFilter: 'blur(4px)' }}
        >
          <h3 className="text-sm mb-3" style={{ fontFamily: "'Cinzel', serif", color: COLORS.text, letterSpacing: '0.04em' }}>
            Chancellerie
          </h3>

          <button
            onClick={() => {
              setSettingsImageError(false);
              setSettingsOpen(true);
            }}
            className="lgm-btn w-full flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded mb-2"
            style={toolbarBtnStyle(false)}
          >
            <ImageIcon size={14} /> Personnaliser l'apparence
          </button>

          <button
            onClick={openNewPlanetForm}
            className="lgm-btn w-full flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded mb-4"
            style={toolbarBtnStyle(true)}
          >
            <Plus size={14} /> Ajouter une planète
          </button>

          <p className="text-xs mb-2" style={{ color: COLORS.textMuted, fontFamily: "'IBM Plex Mono', monospace", letterSpacing: '0.06em' }}>
            PLANÈTES ({planets.length})
          </p>
          <div className="flex flex-col gap-1.5 mb-5">
            {planets.map((p) => (
              <div
                key={p.id}
                className="flex items-center justify-between text-xs px-2 py-1.5 rounded transition-colors"
                style={{ background: p.id === selectedId ? COLORS.accentSoft : 'rgba(255,255,255,0.03)' }}
              >
                <button
                  onClick={() => {
                    setSelectedId(p.id);
                    focusDesiredRef.current.copy(sphericalToVector3(p.orbitRadius, p.orbitAngle, p.elevation));
                    radiusDesiredRef.current = 12;
                  }}
                  className="text-left flex-1 truncate flex items-center"
                  style={{ color: COLORS.text }}
                >
                  <span className="lgm-label-dot" style={{ background: getPlanetColor(p, colorMode) }} />
                  {p.name}
                </button>
                <div className="flex gap-1 ml-2">
                  <button onClick={() => openEditPlanetForm(p)} className="lgm-btn rounded p-0.5" style={{ color: COLORS.textMuted, boxShadow: 'none' }}>
                    <Pencil size={12} />
                  </button>
                  <button onClick={() => requestDeletePlanet(p.id)} className="lgm-btn rounded p-0.5" style={{ color: COLORS.textMuted, boxShadow: 'none' }}>
                    <Trash2 size={12} />
                  </button>
                </div>
              </div>
            ))}
          </div>

          <p className="text-xs mb-2" style={{ color: COLORS.textMuted, fontFamily: "'IBM Plex Mono', monospace" }}>
            ROUTES COMMERCIALES ({routes.length})
          </p>
          <div className="flex flex-col gap-1.5 mb-3">
            {routes.map(([a, b], i) => {
              const pa = planets.find((p) => p.id === a);
              const pb = planets.find((p) => p.id === b);
              if (!pa || !pb) return null;
              return (
                <div key={i} className="flex items-center justify-between text-xs px-2 py-1.5 rounded" style={{ background: 'rgba(255,255,255,0.03)' }}>
                  <span style={{ color: COLORS.text }}>
                    {pa.name} — {pb.name}
                  </span>
                  <button onClick={() => requestDeleteRoute(a, b)} className="lgm-btn rounded p-0.5" style={{ color: COLORS.textMuted, boxShadow: 'none' }}>
                    <Trash2 size={12} />
                  </button>
                </div>
              );
            })}
          </div>

          <div className="flex flex-col gap-2 mb-5">
            <div className="flex gap-2">
              <select
                value={routeDraft.a}
                onChange={(e) => setRouteDraft((d) => ({ ...d, a: e.target.value }))}
                className="flex-1 text-xs rounded px-2 py-1.5 lgm-input"
                style={inputStyle}
              >
                <option value="">Origine…</option>
                {planets.map((p) => (
                  <option key={p.id} value={p.id}>
                    {p.name}
                  </option>
                ))}
              </select>
              <select
                value={routeDraft.b}
                onChange={(e) => setRouteDraft((d) => ({ ...d, b: e.target.value }))}
                className="flex-1 text-xs rounded px-2 py-1.5 lgm-input"
                style={inputStyle}
              >
                <option value="">Destination…</option>
                {planets.map((p) => (
                  <option key={p.id} value={p.id}>
                    {p.name}
                  </option>
                ))}
              </select>
            </div>
            <button onClick={addRoute} className="lgm-btn flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded" style={toolbarBtnStyle(false)}>
              <Link2 size={13} /> Ajouter la route
            </button>
          </div>

          <p className="text-xs mb-2" style={{ color: COLORS.textMuted, fontFamily: "'IBM Plex Mono', monospace", letterSpacing: '0.06em' }}>
            FICHIER
          </p>
          <div className="flex flex-col gap-2 mb-5">
            <div className="flex gap-2">
              <button
                onClick={handleExportJson}
                disabled={!imagesLoaded}
                title={imagesLoaded ? '' : 'Chargement des images en cours…'}
                className="lgm-btn flex-1 flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded"
                style={{ ...toolbarBtnStyle(false), opacity: imagesLoaded ? 1 : 0.5, cursor: imagesLoaded ? 'pointer' : 'not-allowed' }}
              >
                <Download size={13} /> Exporter (.json)
              </button>
              <label
                className="lgm-btn flex-1 flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded cursor-pointer"
                style={toolbarBtnStyle(false)}
              >
                <Upload size={13} /> Importer
                <input type="file" accept="application/json,.json" onChange={handleImportJsonFile} className="hidden" />
              </label>
            </div>
            {exportError && (
              <p className="text-xs" style={{ color: COLORS.crimson }}>
                L'export a échoué — réessaie.
              </p>
            )}
            {importError && (
              <p className="text-xs" style={{ color: COLORS.crimson }}>
                {importError}
              </p>
            )}
            <p className="text-xs leading-relaxed" style={{ color: COLORS.textMuted }}>
              Le fichier exporté inclut les images personnalisées et peut être partagé ou rechargé sur un autre appareil.
            </p>

            <button
              onClick={handleExportHtml}
              disabled={!imagesLoaded || exportHtmlBusy}
              title={imagesLoaded ? '' : 'Chargement des images en cours…'}
              className="lgm-btn w-full flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded"
              style={{
                ...toolbarBtnStyle(false),
                opacity: imagesLoaded && !exportHtmlBusy ? 1 : 0.5,
                cursor: imagesLoaded && !exportHtmlBusy ? 'pointer' : 'not-allowed',
              }}
            >
              <Download size={13} /> {exportHtmlBusy ? 'Génération…' : 'Exporter le .html (sauvegarde intégrée)'}
            </button>
            {exportHtmlError && (
              <p className="text-xs leading-relaxed" style={{ color: COLORS.crimson }}>
                {exportHtmlError}
              </p>
            )}
            <p className="text-xs leading-relaxed" style={{ color: COLORS.textMuted }}>
              Génère une copie de cette page avec les données actuelles écrites dans le fichier lui-même. Remplace le .html du dépôt GitHub par ce fichier : il s'ouvrira directement avec cette carte, sans dépendre du localStorage du navigateur.
            </p>
          </div>

          <button
            onClick={requestReset}
            className="lgm-btn w-full flex items-center justify-center gap-1.5 text-xs px-3 py-2 rounded"
            style={{ ...toolbarBtnStyle(false), color: COLORS.crimson, borderColor: COLORS.crimson + '66' }}
          >
            <RotateCcw size={13} /> Réinitialiser la carte
          </button>
        </div>
      )}

      {settingsOpen && (
        <div className="absolute inset-0 flex items-center justify-center p-4 z-20" style={{ background: 'rgba(6,5,3,0.7)', backdropFilter: 'blur(3px)' }}>
          <div className="w-full max-w-md max-h-full overflow-y-auto lgm-scroll rounded-lg p-5" style={{ background: COLORS.panel, border: '1px solid ' + COLORS.panelBorder }}>
            <div className="flex items-center justify-between mb-4">
              <h3 className="text-base" style={{ fontFamily: "'Cinzel', serif", color: COLORS.text }}>
                Personnaliser l'apparence
              </h3>
              <button onClick={() => setSettingsOpen(false)} className="lgm-btn rounded p-1" style={{ color: COLORS.textMuted, boxShadow: 'none' }}>
                <X size={18} />
              </button>
            </div>

            <div className="flex flex-col gap-4">
              <AppearanceImageField
                label="Fond de l'univers (skybox)"
                hint="Idéalement une texture équirectangulaire (ratio 2:1) : étoiles, nébuleuse… Remplace le fond généré automatiquement."
                url={resolveImage(mapSettings.skyboxUrl)}
                previewWidth={64}
                previewHeight={40}
                onChangeFile={handleSettingsImageFile('skyboxUrl', 2048, 0.8)}
                onClear={() => clearSettingsImage('skyboxUrl')}
              />

              <AppearanceImageField
                label="Bannière / logo en en-tête"
                hint={'Affiché à côté du titre « Carte du Landsraad ».'}
                url={resolveImage(mapSettings.bannerUrl)}
                previewWidth={44}
                previewHeight={44}
                onChangeFile={handleSettingsImageFile('bannerUrl', 800, 0.88)}
                onClear={() => clearSettingsImage('bannerUrl')}
              />

              <AppearanceImageField
                label="Fond du panneau de détail"
                hint="Utilisé en arrière-plan (assombri) de la fiche planète, à droite."
                url={resolveImage(mapSettings.panelBgUrl)}
                previewWidth={64}
                previewHeight={44}
                onChangeFile={handleSettingsImageFile('panelBgUrl', 1400, 0.82)}
                onClear={() => clearSettingsImage('panelBgUrl')}
              />

              {settingsImageError && (
                <p className="text-xs" style={{ color: COLORS.crimson }}>
                  Impossible de charger cette image — réessaie avec un autre fichier.
                </p>
              )}
            </div>

            <button
              onClick={() => setSettingsOpen(false)}
              className="lgm-btn w-full text-sm px-3 py-2 rounded mt-5"
              style={toolbarBtnStyle(true)}
            >
              Fermer
            </button>
          </div>
        </div>
      )}

      {editingPlanet && (
        <div className="absolute inset-0 flex items-center justify-center p-4 z-20" style={{ background: 'rgba(6,5,3,0.7)', backdropFilter: 'blur(3px)' }}>
          <div className="w-full max-w-md max-h-full overflow-y-auto lgm-scroll rounded-lg p-5" style={{ background: COLORS.panel, border: '1px solid ' + COLORS.panelBorder }}>
            <div className="flex items-center justify-between mb-4">
              <h3 className="text-base" style={{ fontFamily: "'Cinzel', serif", color: COLORS.text }}>
                {editingPlanet.id ? 'Modifier la planète' : 'Nouvelle planète'}
              </h3>
              <button onClick={closeEditPlanetForm} className="lgm-btn rounded p-1" style={{ color: COLORS.textMuted, boxShadow: 'none' }}>
                <X size={18} />
              </button>
            </div>

            <div className="flex flex-col gap-3">
              <Field label="Nom de la planète">
                <input
                  value={editingPlanet.name}
                  onChange={(e) => setEditingPlanet((p) => ({ ...p, name: e.target.value }))}
                  className="w-full text-sm rounded px-2.5 py-2 lgm-input"
                  style={inputStyle}
                  placeholder="ex. Kolhar"
                />
              </Field>
              <Field label="Maison régnante">
                <input
                  value={editingPlanet.house}
                  onChange={(e) => setEditingPlanet((p) => ({ ...p, house: e.target.value }))}
                  className="w-full text-sm rounded px-2.5 py-2 lgm-input"
                  style={inputStyle}
                  placeholder="ex. Maison Mikarrol"
                />
              </Field>
              <div className="grid grid-cols-2 gap-3">
                <Field label="Faction / Catégorie">
                  <select
                    value={editingPlanet.faction}
                    onChange={(e) => setEditingPlanet((p) => ({ ...p, faction: e.target.value }))}
                    className="w-full text-sm rounded px-2.5 py-2 lgm-input"
                    style={inputStyle}
                  >
                    {FACTIONS.map((f) => (
                      <option key={f} value={f}>
                        {f}
                      </option>
                    ))}
                  </select>
                </Field>
                <Field label="Environnement">
                  <select
                    value={editingPlanet.environment || 'barren'}
                    onChange={(e) => setEditingPlanet((p) => ({ ...p, environment: e.target.value }))}
                    className="w-full text-sm rounded px-2.5 py-2 lgm-input"
                    style={inputStyle}
                  >
                    {ENVIRONMENTS.map((env) => (
                      <option key={env.value} value={env.value}>
                        {env.label}
                      </option>
                    ))}
                  </select>
                </Field>
              </div>

              <Field label="Image personnalisée (optionnel)">
                <div className="flex items-center gap-3">
                  {resolveImage(editingPlanet.imageUrl) ? (
                    <img
                      src={resolveImage(editingPlanet.imageUrl)}
                      alt=""
                      className="rounded object-cover flex-shrink-0"
                      style={{ width: 56, height: 56, border: '1px solid ' + COLORS.panelBorder }}
                    />
                  ) : (
                    <div
                      className="rounded flex items-center justify-center flex-shrink-0"
                      style={{ width: 56, height: 56, border: '1px dashed ' + COLORS.panelBorder, color: COLORS.dim }}
                    >
                      <ImageIcon size={20} />
                    </div>
                  )}
                  <div className="flex flex-col gap-1.5 flex-1">
                    <label
                      className="lgm-btn text-xs px-2.5 py-1.5 rounded text-center cursor-pointer"
                      style={toolbarBtnStyle(false)}
                    >
                      {editingPlanet.imageUrl ? "Changer l'image" : 'Choisir une image'}
                      <input type="file" accept="image/*" onChange={handleEditingImageFile} className="hidden" />
                    </label>
                    {editingPlanet.imageUrl && (
                      <button
                        type="button"
                        onClick={() =>
                          setEditingPlanet((p) => {
                            if (isImageKey(p.imageUrl) && p.imageUrl !== originalPlanetImagesRef.current.imageUrl) {
                              idbDeleteImage(p.imageUrl).catch(() => {});
                              setImageCache((c) => {
                                const next = { ...c };
                                delete next[p.imageUrl];
                                return next;
                              });
                            }
                            return { ...p, imageUrl: '' };
                          })
                        }
                        className="lgm-btn text-xs px-2.5 py-1.5 rounded"
                        style={{ ...toolbarBtnStyle(false), color: COLORS.crimson, borderColor: COLORS.crimson + '66' }}
                      >
                        Retirer l'image
                      </button>
                    )}
                  </div>
                </div>
                <p className="text-xs mt-1.5 leading-relaxed" style={{ color: COLORS.textMuted }}>
                  Idéalement une texture équirectangulaire (ratio 2:1). Sans image, une texture est générée automatiquement selon l'environnement.
                </p>
                {imageError && (
                  <p className="text-xs mt-1" style={{ color: COLORS.crimson }}>
                    Impossible de charger cette image — réessaie avec un autre fichier.
                  </p>
                )}
              </Field>

              <Field label="Blason de la maison (optionnel)">
                <div className="flex items-center gap-3">
                  {resolveImage(editingPlanet.crestUrl) ? (
                    <img
                      src={resolveImage(editingPlanet.crestUrl)}
                      alt=""
                      className="rounded object-cover flex-shrink-0"
                      style={{ width: 44, height: 44, border: '1px solid ' + COLORS.panelBorder, background: 'rgba(255,255,255,0.03)' }}
                    />
                  ) : (
                    <div
                      className="rounded flex items-center justify-center flex-shrink-0"
                      style={{ width: 44, height: 44, border: '1px dashed ' + COLORS.panelBorder, color: COLORS.dim }}
                    >
                      <ImageIcon size={16} />
                    </div>
                  )}
                  <div className="flex flex-col gap-1.5 flex-1">
                    <label
                      className="lgm-btn text-xs px-2.5 py-1.5 rounded text-center cursor-pointer"
                      style={toolbarBtnStyle(false)}
                    >
                      {editingPlanet.crestUrl ? 'Changer le blason' : 'Choisir un blason'}
                      <input type="file" accept="image/*" onChange={handleEditingCrestFile} className="hidden" />
                    </label>
                    {editingPlanet.crestUrl && (
                      <button
                        type="button"
                        onClick={() =>
                          setEditingPlanet((p) => {
                            if (isImageKey(p.crestUrl) && p.crestUrl !== originalPlanetImagesRef.current.crestUrl) {
                              idbDeleteImage(p.crestUrl).catch(() => {});
                              setImageCache((c) => {
                                const next = { ...c };
                                delete next[p.crestUrl];
                                return next;
                              });
                            }
                            return { ...p, crestUrl: '' };
                          })
                        }
                        className="lgm-btn text-xs px-2.5 py-1.5 rounded"
                        style={{ ...toolbarBtnStyle(false), color: COLORS.crimson, borderColor: COLORS.crimson + '66' }}
                      >
                        Retirer le blason
                      </button>
                    )}
                  </div>
                </div>
                <p className="text-xs mt-1.5 leading-relaxed" style={{ color: COLORS.textMuted }}>
                  Affiché à côté du nom de la maison sur la fiche planète. Idéalement une image carrée.
                </p>
              </Field>

              <Field label="Distance depuis Kaitain (a.l.)">
                <input
                  type="number"
                  value={editingPlanet.distanceLy === undefined ? '' : editingPlanet.distanceLy}
                  onChange={(e) => setEditingPlanet((p) => ({ ...p, distanceLy: e.target.value === '' ? '' : Number(e.target.value) }))}
                  className="w-full text-sm rounded px-2.5 py-2 lgm-input"
                  style={inputStyle}
                />
              </Field>
              <Field label="Description">
                <textarea
                  value={editingPlanet.description}
                  onChange={(e) => setEditingPlanet((p) => ({ ...p, description: e.target.value }))}
                  rows={4}
                  className="w-full text-sm rounded px-2.5 py-2 lgm-input"
                  style={inputStyle}
                />
              </Field>
              <Field label="Ressources (optionnel)">
                <input
                  value={editingPlanet.resources}
                  onChange={(e) => setEditingPlanet((p) => ({ ...p, resources: e.target.value }))}
                  className="w-full text-sm rounded px-2.5 py-2 lgm-input"
                  style={inputStyle}
                />
              </Field>
              <div className="grid grid-cols-2 gap-3">
                <Field label="Taille">
                  <select
                    value={editingPlanet.size}
                    onChange={(e) => setEditingPlanet((p) => ({ ...p, size: e.target.value }))}
                    className="w-full text-sm rounded px-2.5 py-2 lgm-input"
                    style={inputStyle}
                  >
                    {SIZES.map((s) => (
                      <option key={s.value} value={s.value}>
                        {s.label}
                      </option>
                    ))}
                  </select>
                </Field>
                <Field label="Distance orbitale">
                  <input
                    type="number"
                    value={editingPlanet.orbitRadius}
                    onChange={(e) => setEditingPlanet((p) => ({ ...p, orbitRadius: Number(e.target.value) }))}
                    className="w-full text-sm rounded px-2.5 py-2 lgm-input"
                    style={inputStyle}
                  />
                </Field>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <Field label="Angle (°)">
                  <input
                    type="number"
                    value={editingPlanet.orbitAngle}
                    onChange={(e) => setEditingPlanet((p) => ({ ...p, orbitAngle: Number(e.target.value) }))}
                    className="w-full text-sm rounded px-2.5 py-2 lgm-input"
                    style={inputStyle}
                  />
                </Field>
                <Field label="Élévation (°)">
                  <input
                    type="number"
                    value={editingPlanet.elevation}
                    onChange={(e) => setEditingPlanet((p) => ({ ...p, elevation: Number(e.target.value) }))}
                    className="w-full text-sm rounded px-2.5 py-2 lgm-input"
                    style={inputStyle}
                  />
                </Field>
              </div>
            </div>

            <div className="flex gap-2 mt-5">
              <button onClick={closeEditPlanetForm} className="lgm-btn flex-1 text-sm px-3 py-2 rounded" style={toolbarBtnStyle(false)}>
                Annuler
              </button>
              <button onClick={savePlanetForm} className="lgm-btn flex-1 text-sm px-3 py-2 rounded" style={toolbarBtnStyle(true)}>
                Enregistrer
              </button>
            </div>
          </div>
        </div>
      )}

      {confirmDialog && (
        <div className="absolute inset-0 flex items-center justify-center p-4 z-30" style={{ background: 'rgba(6,5,3,0.75)', backdropFilter: 'blur(3px)' }}>
          <div className="w-full max-w-sm rounded-lg p-5" style={{ background: COLORS.panel, border: '1px solid ' + COLORS.panelBorder }}>
            <p className="text-sm mb-4" style={{ color: COLORS.text }}>
              {confirmDialog.message}
            </p>
            <div className="flex gap-2">
              <button onClick={() => setConfirmDialog(null)} className="lgm-btn flex-1 text-sm px-3 py-2 rounded" style={toolbarBtnStyle(false)}>
                Annuler
              </button>
              <button
                onClick={confirmDialog.onConfirm}
                className="lgm-btn flex-1 text-sm px-3 py-2 rounded"
                style={{ ...toolbarBtnStyle(false), color: COLORS.crimson, borderColor: COLORS.crimson + '66' }}
              >
                Confirmer
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(<LandsraadGalaxyMap />);

</script>
</body>
</html>
